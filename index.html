<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JR TECH</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

</head>

<body>

<header>

    <div class="logo">

        JR TECH

    </div>

    <nav>

        <a href="#">Inicio</a>

        <a href="#products">Productos</a>

        <a href="#">Contacto</a>

    </nav>

    <div id="cartBtn">

        🛒 <span id="count">0</span>

    </div>

</header>

<section class="hero">

    <div class="hero-text">

        <h1>JR TECH</h1>

        <h2>Tecnología al mejor precio</h2>

        <p>

            Audífonos • Cargadores • Cables • Power Bank • Accesorios

        </p>

        <button id="verProductos">

            Comprar ahora

        </button>

    </div>

</section>

<section class="search-bar">

    <input

        id="search"

        type="text"

        placeholder="🔍 Buscar productos..."

    >

</section>

<section class="categorias">

    <button class="cat active">Todos</button>

    <button class="cat">Audífonos</button>

    <button class="cat">Cargadores</button>

    <button class="cat">Cables</button>

    <button class="cat">Power Bank</button>

</section>

<main id="products">

</main>

<aside id="cart" class="cart-panel hidden">

    <div class="cart-header">

        <h2>🛒 Mi carrito</h2>

        <button id="closeCart">

            ✖

        </button>

    </div>

    <div id="cartItems" class="cart-items">

    </div>

    <div class="cart-footer">

        <h3>

            Total

        </h3>

        <h2>

            $<span id="total">0</span>

        </h2>

        <button id="checkout">

            Finalizar compra

        </button>

    </div>

</aside>

<script src="products.js"></script>

<script src="script.js"></script>

</body>

</html>
